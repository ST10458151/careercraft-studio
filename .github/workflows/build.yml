name: .NET build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore CareerCraft.Web/CareerCraft.Web.csproj
      - name: Build with warnings as errors for vulnerable packages
        run: dotnet build CareerCraft.Web/CareerCraft.Web.csproj --configuration Release --no-restore -p:NuGetAuditLevel=high -warnaserror:NU1903
